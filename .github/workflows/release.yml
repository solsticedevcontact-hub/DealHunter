name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Debug Files (نشوف إيه الموجود)
        run: |
          dir
          dir dealhunter
      - name: Build exe (بدون أيقونة لضمان النجاح)
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name DealHunter --add-data "dealhunter/web;dealhunter/web" --collect-all arabic_reshaper --collect-submodules pystray main.py
      - uses: actions/upload-artifact@v4
        with:
          name: DealHunter
          path: dist/DealHunter.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DealHunter.exe
          generate_release_notes: true