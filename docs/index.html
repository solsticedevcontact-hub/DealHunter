<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صايد الفرصة 🎯</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎯%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#080a10;--bg2:#0d1017;--card:#121722;--card2:#181f2d;--line:#222b3d;--text:#e9edf6;--muted:#8a94ab;
  --g:#22e678;--c:#35d0ff;--gold:#ffc83d;--red:#ff5c70;--vio:#8b7bff;--r:16px;
  --grad:linear-gradient(135deg,#22e678,#35d0ff);
  --shadow:0 10px 30px -12px rgba(0,0,0,.7);
}
@media (prefers-color-scheme: light){
  :root.auto{--bg:#f2f5fa;--bg2:#e9eef6;--card:#fff;--card2:#f3f6fb;--line:#dbe2ee;--text:#121826;--muted:#5d6980;--shadow:0 10px 30px -14px rgba(20,30,60,.25)}
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(1200px 600px at 85% -10%,rgba(53,208,255,.10),transparent 60%),radial-gradient(900px 500px at 10% 110%,rgba(34,230,120,.08),transparent 60%),var(--bg);
  color:var(--text);font-family:"Segoe UI","Noto Sans Arabic",Tahoma,system-ui,sans-serif;font-size:15px;line-height:1.5;display:flex;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--c)}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
:focus-visible{outline:2px solid var(--c);outline-offset:2px;border-radius:8px}

/* ---------- sidebar ---------- */
aside{width:236px;flex:none;background:linear-gradient(180deg,var(--bg2),rgba(13,16,23,.6));border-inline-start:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;gap:6px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.logo svg{width:38px;height:38px;flex:none}
.logo b{display:block;font-size:18px;letter-spacing:.2px}
.logo small{color:var(--muted);font-size:12px}
nav{display:flex;flex-direction:column;gap:4px}
nav button{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:var(--muted);text-align:start;transition:.15s;position:relative}
nav button:hover{background:var(--card);color:var(--text)}
nav button.on{background:var(--card2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
nav button.on::before{content:"";position:absolute;inset-inline-start:-14px;top:10px;bottom:10px;width:4px;border-radius:4px;background:var(--grad)}
nav .ico{font-size:18px;width:24px;text-align:center}
nav .cnt{margin-inline-start:auto;font-size:12px;background:var(--grad);color:#04140b;font-weight:700;border-radius:20px;padding:1px 8px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.saved{background:linear-gradient(135deg,rgba(34,230,120,.14),rgba(53,208,255,.10));border:1px solid rgba(34,230,120,.25);border-radius:14px;padding:12px 14px}
.saved small{color:var(--muted);display:block}
.saved b{font-size:24px;color:var(--g)}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);padding:6px 10px;border-radius:20px;background:var(--card)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--g);box-shadow:0 0 8px var(--g)}.dot.bad{background:var(--red)}.dot.spin{background:var(--gold);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

/* ---------- main ---------- */
main{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:16px 28px;border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
header h1{font-size:22px;white-space:nowrap}
.search{flex:1;max-width:460px;margin-inline-start:auto;position:relative}
.search input[type=text]{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 38px 9px 12px;outline:0}
.search input[type=text]:focus{border-color:var(--c)}
.search span{position:absolute;inset-inline-start:auto;right:12px;top:8px;opacity:.6}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:12px;background:var(--card2);border:1px solid var(--line);transition:.15s;white-space:nowrap;font-weight:600}
.btn:hover{border-color:var(--c);transform:translateY(-1px)}
.btn.pri{background:var(--grad);color:#04140b;border:0}
.btn.pri:hover{filter:brightness(1.1)}
.btn.sm{padding:6px 12px;font-size:13.5px;border-radius:10px}
.btn.danger{color:var(--red)}
.btn[disabled]{opacity:.5;pointer-events:none}
#view{flex:1;overflow:auto;padding:24px 28px 60px;scroll-behavior:smooth}
.sec{margin-bottom:34px}
.sec>h2{font-size:18px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.sec>h2 small{color:var(--muted);font-weight:400;font-size:13px}
.sec>h2 .more{margin-inline-start:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.chip{padding:6px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:13.5px;transition:.15s}
.chip:hover{color:var(--text)}.chip.on{background:var(--grad);color:#04140b;border-color:transparent;font-weight:700}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:18px}
.toolbar label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13.5px}
select,input[type=text],input[type=number],input[type=password],input[type=time]{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;outline:0;color:var(--text)}
select:focus,input:focus{border-color:var(--c)}
input[type=checkbox]{accent-color:var(--g);width:17px;height:17px}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .18s,border-color .18s;content-visibility:auto;contain-intrinsic-size:300px 300px}
.card:hover{transform:translateY(-3px);border-color:#34415c}
.card .img{position:relative;aspect-ratio:460/215;background:linear-gradient(135deg,#1b2336,#101521);display:grid;place-items:center;font-size:42px;color:#2c3853}
.card .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-size:15.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.price{display:flex;align-items:baseline;gap:8px}
.price b{font-size:22px}.price s{color:var(--muted);font-size:14px}
.acts{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.acts .btn{flex:1;justify-content:center}
.tag{position:absolute;top:10px;inset-inline-start:10px;display:flex;gap:6px;z-index:2}
.tag2{position:absolute;bottom:8px;inset-inline-end:10px;z-index:2}
.badge{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;background:rgba(8,10,16,.78);backdrop-filter:blur(6px);display:inline-flex;align-items:center;gap:6px}
.badge .sd{width:8px;height:8px;border-radius:50%}
.off{background:var(--red);color:#fff;font-size:15px;padding:4px 11px;direction:ltr;unicode-bidi:isolate}
.free{background:var(--grad);color:#04140b}
.low{background:linear-gradient(135deg,#ff9a3d,#ff4e50);color:#fff}
.v-great{color:var(--g)}.v-ok{color:var(--gold)}.v-no{color:var(--red)}
.bar0{height:8px;border-radius:8px;background:var(--card2);overflow:hidden}.bar0 i{display:block;height:100%;background:var(--grad);transition:width .3s}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}.specs div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 14px}.specs small{color:var(--muted);display:block}.specs b{font-size:15px;word-break:break-word}
.own{background:#27324a;color:var(--muted)}
.done{opacity:.55}
.cd{color:var(--gold);font-weight:600}

/* ---------- hero ---------- */
.hero{position:relative;border-radius:22px;overflow:hidden;min-height:300px;display:flex;align-items:flex-end;border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:26px;background:#101521}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:saturate(1.1)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(8,10,16,.96) 8%,rgba(8,10,16,.35) 60%,rgba(8,10,16,.1))}
.hero .in{position:relative;z-index:2;padding:26px 30px;display:flex;flex-direction:column;gap:12px;max-width:760px}
.hero h2{font-size:34px;line-height:1.2}
.hero .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dots{position:absolute;z-index:3;top:16px;inset-inline-end:18px;display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.3);cursor:pointer}.dots i.on{background:var(--g);width:22px;border-radius:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:28px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.kpi small{color:var(--muted)}.kpi b{display:block;font-size:30px;margin-top:2px}
.kpi.g b{color:var(--g)}.kpi.c b{color:var(--c)}.kpi.y b{color:var(--gold)}.kpi.v b{color:var(--vio)}

/* ---------- lists / forms ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:18px}
.panel h3{font-size:16.5px;margin-bottom:4px}.panel p.sub{color:var(--muted);font-size:13.5px;margin-bottom:14px}
.row2{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:10px 0}
.field{display:flex;flex-direction:column;gap:4px}.field small{color:var(--muted);font-size:12.5px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px dashed var(--line)}
.sw:last-child{border:0}
.tog{position:relative;width:44px;height:25px;flex:none}
.tog input{position:absolute;opacity:0;inset:0;cursor:pointer;z-index:2;margin:0;width:100%;height:100%}
.tog i{position:absolute;inset:0;background:#2a3348;border-radius:20px;transition:.2s}
.tog i::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.2s}
.tog input:checked+i{background:var(--g)}.tog input:checked+i::after{inset-inline-start:22px;background:#04140b}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:6px 16px;border-radius:9px;color:var(--muted)}.seg button.on{background:var(--grad);color:#04140b;font-weight:700}
.wrow{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:10px;flex-wrap:wrap}
.wrow .th{width:92px;height:43px;border-radius:8px;background:#1b2336;object-fit:cover;flex:none}
.wrow .t{flex:1;min-width:180px}.wrow .t b{display:block}
.sugg{position:absolute;z-index:20;top:100%;inset-inline:0;background:var(--card2);border:1px solid var(--line);border-radius:12px;margin-top:4px;max-height:300px;overflow:auto;box-shadow:var(--shadow)}
.sugg button{display:flex;gap:10px;align-items:center;width:100%;padding:8px 12px;text-align:start}.sugg button:hover{background:var(--card)}
.sugg img{width:64px;height:30px;object-fit:cover;border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:start;padding:10px 12px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--card)}
tr:hover td{background:var(--card2)}
.bars{display:flex;align-items:flex-end;gap:14px;height:170px;padding:10px 4px}
.bars div.c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .stack{display:flex;gap:4px;align-items:flex-end;height:130px}
.bars .b{width:20px;border-radius:6px 6px 0 0;min-height:3px}
.rank{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}.rank:last-child{border:0}
.rank i{font-style:normal;width:26px;height:26px;border-radius:8px;background:var(--card2);display:grid;place-items:center;font-size:12.5px;color:var(--muted)}
.rank .bar{height:6px;border-radius:6px;background:var(--grad);margin-top:4px}
.empty{text-align:center;color:var(--muted);padding:46px 10px;background:var(--card);border:1px dashed var(--line);border-radius:16px}
.empty big{display:block;font-size:46px;margin-bottom:8px}
.skel{height:230px;border-radius:16px;background:linear-gradient(90deg,var(--card),var(--card2),var(--card));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.banner{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,rgba(139,123,255,.18),rgba(53,208,255,.12));border:1px solid rgba(139,123,255,.35);border-radius:14px;padding:12px 16px;margin-bottom:18px;flex-wrap:wrap}
.health{display:flex;gap:8px;flex-wrap:wrap}
.hp{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:13px}
.err{color:var(--red);font-size:12.5px}
#toasts{position:fixed;bottom:18px;inset-inline-start:18px;display:flex;flex-direction:column;gap:8px;z-index:99}
.toast{background:var(--card2);border:1px solid var(--line);border-inline-start:4px solid var(--g);border-radius:12px;padding:11px 16px;box-shadow:var(--shadow);animation:in .25s}
.toast.bad{border-inline-start-color:var(--red)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.modal{position:fixed;inset:0;background:rgba(3,5,9,.72);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:90;padding:20px}
.modal>div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:min(720px,100%);max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal img.pv{width:100%;border-radius:12px}
pre.log{background:var(--bg2);border-radius:10px;padding:12px;max-height:50vh;overflow:auto;font-size:12px;direction:ltr;text-align:left;white-space:pre-wrap}
@media (max-width:900px){aside{width:72px;padding:12px 8px}.logo div,nav button span.l,.saved,.side-foot .pill span{display:none}nav button{justify-content:center;padding:12px}nav .cnt{display:none}#view{padding:16px}header{padding:12px 16px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<aside>
  <div class="logo">
    <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#0f1320"/><circle cx="32" cy="32" r="22" fill="none" stroke="url(#g)" stroke-width="3.5"/><circle cx="32" cy="32" r="12" fill="none" stroke="url(#g)" stroke-width="3.5"/><circle cx="32" cy="32" r="4" fill="#ff5c70"/><path d="M32 5v12M32 47v12M5 32h12M47 32h12" stroke="url(#g)" stroke-width="3.5" stroke-linecap="round"/><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22e678"/><stop offset="1" stop-color="#35d0ff"/></linearGradient></defs></svg>
    <div><b>صايد الفرصة</b><small id="ver">DealHunter</small></div>
  </div>
  <nav id="nav"></nav>
  <div class="side-foot">
    <div class="saved"><small>💰 وفّرت لحد دلوقتي</small><b class="num" id="saved">$0.00</b></div>
    <div class="pill"><i class="dot" id="sdot"></i><span id="stext">بيحمّل…</span></div>
  </div>
</aside>
<main>
  <header>
    <h1 id="title"></h1>
    <div class="search"><input id="q" type="text" placeholder="ابحث باسم اللعبة…  ( / )" autocomplete="off"><span>🔎</span></div>
    <button class="btn pri" id="checkBtn">🔄 افحص دلوقتي</button>
  </header>
  <div id="view"></div>
</main>
<div id="toasts"></div>
<script>
"use strict";
/* ============ أساسيات ============ */
const P = new URLSearchParams(location.search);
const TOKEN = P.get("t") || sessionStorage.getItem("dh_t") || "";
sessionStorage.setItem("dh_t", TOKEN);
const $ = s => document.querySelector(s);
function h(tag, props, ...kids){
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})){
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "value") e.value = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)){ if (c == null || c === false) continue; e.append(c instanceof Node ? c : document.createTextNode(String(c))); }
  return e;
}
async function api(path, body){
  const opt = {headers: {"X-Token": TOKEN}};
  if (body !== undefined){ opt.method = "POST"; opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch("/api/" + path, opt);
  let j = {}; try { j = await r.json(); } catch (_) {}
  if (!r.ok) throw new Error(j.error || ("خطأ " + r.status));
  return j;
}
function toast(msg, bad){ const t = h("div", {class: "toast" + (bad ? " bad" : "")}, msg); $("#toasts").append(t); setTimeout(() => t.remove(), 4200); }
const money = n => "$" + (Number(n) || 0).toFixed(2);
const num = (t) => h("span", {class: "num"}, t);
const safeImg = u => (typeof u === "string" && /^https:\/\//.test(u)) ? u : null;
const unit = (n, one, two, few, many) => n === 1 ? one : n === 2 ? two : (n >= 3 && n <= 10) ? n + " " + few : n + " " + many;
function left(end){
  const s = Math.floor(end - Date.now() / 1000);
  if (s <= 0) return "العرض خلص";
  const d = Math.floor(s / 86400), hr = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), p = [];
  if (d) p.push(unit(d, "يوم", "يومين", "أيام", "يوم"));
  if (hr) p.push(unit(hr, "ساعة", "ساعتين", "ساعات", "ساعة"));
  if (m && !d) p.push(unit(m, "دقيقة", "دقيقتين", "دقايق", "دقيقة"));
  return "فاضل " + (p.join(" و") || "أقل من دقيقة");
}
function ago(ts){
  if (!ts) return "لسه";
  const s = Math.floor(Date.now() / 1000 - ts);
  if (s < 90) return "من شوية";
  const m = Math.floor(s / 60); if (m < 60) return "من " + unit(m, "دقيقة", "دقيقتين", "دقايق", "دقيقة");
  const hr = Math.floor(m / 60); if (hr < 24) return "من " + unit(hr, "ساعة", "ساعتين", "ساعات", "ساعة");
  return "من " + unit(Math.floor(hr / 24), "يوم", "يومين", "أيام", "يوم");
}
function inn(ts){
  const s = Math.max(0, Math.floor(ts - Date.now() / 1000)), m = Math.ceil(s / 60);
  return m <= 1 ? "كمان شوية" : m < 60 ? "بعد " + unit(m, "دقيقة", "دقيقتين", "دقايق", "دقيقة") : "بعد " + unit(Math.round(m / 60), "ساعة", "ساعتين", "ساعات", "ساعة");
}
const COLORS = {Steam: "#66c0f4", Epic: "#f1f5f9", GOG: "#b57cff", Humble: "#ff5c5c", Fanatical: "#ff9b3d", GMG: "#3ddc84", "itch.io": "#fa5c5c",
  "Prime Gaming": "#00a8e1", Ubisoft: "#3b82f6", "EA/Origin": "#ff4747", GamersGate: "#f59e0b", Gamesplanet: "#14b8a6", Blizzard: "#00aeff"};
const storeBadge = s => h("span", {class: "badge"}, h("i", {class: "sd", style: "background:" + (COLORS[s] || "#8a94ab")}), s);
const openUrl = url => api("open", {url}).catch(e => toast(e.message, true));

/* ============ الحالة ============ */
let S = null, page = "home", Q = "", dirty = false, busy = false;
const F = {free: "all", hideOwnedFree: false, store: "all", min: 50, max: "", sort: "savings", low: false, hideOwned: true, limit: 24,

refresh(true);
</script>
